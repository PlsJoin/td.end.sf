<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マージタワーディフェンス</title>
<style>
:root{--bg:#1d2b12;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a0a}}
:root[data-theme="dark"]{--bg:#101a0a}
html,body{margin:0;height:100%;background:var(--bg)}
body{display:flex;justify-content:center;align-items:center}
canvas{width:100%;max-width:480px;max-height:100%;aspect-ratio:480/860;touch-action:none;display:block;user-select:none;-webkit-user-select:none}
#cb{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
#cb[hidden]{display:none}
.bx{background:#2c4a1a;color:#fff;padding:18px;border-radius:14px;width:min(320px,82vw);font-family:sans-serif;font-weight:bold}
.bx input{width:100%;box-sizing:border-box;font-size:20px;padding:10px;margin:12px 0 6px;border-radius:8px;border:0;text-transform:uppercase}
.bx .row{display:flex;gap:10px;margin-top:10px}
.bx button{flex:1;font-size:17px;padding:10px;border:0;border-radius:8px;font-weight:bold}
#cok{background:#f6c026}
#cm{min-height:20px;color:#ffd95a;font-size:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cb" hidden>
<div class="bx">
<div>コードを入力</div>
<input id="ci" autocomplete="off" autocapitalize="characters" spellcheck="false">
<div id="cm"></div>
<div class="row"><button id="cok">OK</button><button id="cx">閉じる</button></div>
</div>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=480,H=860,SAVE_KEY='td_save_v5',BEST_KEY='td_best_v2',GIFT_KEY='td_gift_v1',CODE_KEY='td_codes_v1';
const WAVE_SEC=20,HUD_H=206,GIFT_SEC=300,ADAPT=1.25;
const CODES={
  'WELCOME':{money:300,towers:[1,1]},
  'BIGGIFT':{money:3000,towers:[3,3]},
  'LUCKY7':{towers:[7]}
};
cv.width=W;cv.height=H;
const P=[[110,150],[110,230],[340,230],[340,340],[110,340],[110,450],[340,450],[340,565],[375,590]];
const L=[0];
for(let i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
const TOTAL=L[L.length-1];
function pos(d){
  for(let i=1;i<P.length;i++){
    if(d<=L[i]){
      const t=(d-L[i-1])/(L[i]-L[i-1]);
      return [P[i-1][0]+(P[i][0]-P[i-1][0])*t,P[i-1][1]+(P[i][1]-P[i-1][1])*t];
    }
  }
  return P[P.length-1];
}
const SPOTS=[[40,285],[225,285],[430,285],[40,395],[225,395],[430,395],[40,505],[110,515],[225,515]];
const HAND_N=8;
const TRASH={x:14,y:566,w:52,h:60};
const BUY={x:10,y:650,w:130,h:200};
const GIFT={x:8,y:6,w:228,h:38};
const CODEBTN={x:244,y:6,w:228,h:38};
function slotRect(i){return {x:162+(i%4)*76,y:662+((i/4)|0)*86,w:68,h:68};}
function readJSON(k){
  try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}
}
function readBest(){
  try{return parseInt(localStorage.getItem(BEST_KEY)||'0',10)||0;}catch(e){return 0;}
}
function readGift(){
  try{return parseInt(localStorage.getItem(GIFT_KEY)||'0',10)||0;}catch(e){return 0;}
}
let giftAt=readGift();
function setGift(t){
  giftAt=t;
  try{localStorage.setItem(GIFT_KEY,String(t));}catch(e){}
}
function usedCodes(){
  const a=readJSON(CODE_KEY);
  return Array.isArray(a)?a:[];
}
function markUsed(c){
  const a=usedCodes();
  a.push(c);
  try{localStorage.setItem(CODE_KEY,JSON.stringify(a));}catch(e){}
}
function count(w){return 4+Math.floor(w*1.3);}
let S;
let paused=false;
function reset(useSave){
  S={money:45,wave:1,waveT:WAVE_SEC,spawnQ:count(1),gap:14/count(1),spawnT:0,bossT:6,bossOn:true,
     enemies:[],bullets:[],texts:[],
     tiles:SPOTS.map((p,i)=>({x:p[0],y:p[1],lv:0,ang:Math.PI/2,cd:0,open:i<=2})),
     hand:Array(HAND_N).fill(0),handT:Array(HAND_N).fill(0),
     buys:0,lives:20,over:false,flash:0,hit:0,drag:null,px:0,py:0,time:0,best:readBest(),ultCd:0,ultFlash:0};
  S.hand[0]=1;
  S.hand[1]=1;
  const d=useSave?readJSON(SAVE_KEY):null;
  if(d&&Array.isArray(d.hand)&&Array.isArray(d.tiles)){
    S.money=d.money;S.wave=d.wave;S.waveT=d.waveT;S.spawnQ=d.spawnQ;S.lives=d.lives;S.buys=d.buys||0;
    S.gap=14/count(S.wave);S.bossOn=false;
    for(let i=0;i<HAND_N;i++)S.hand[i]=d.hand[i]||0;
    S.tiles.forEach((t,i)=>{
      t.lv=d.tiles[i]||0;
      t.open=Array.isArray(d.open)?!!d.open[i]:(t.lv>0||i<=2);
    });
  }
}
reset(true);
function save(){
  if(S.drag||S.over)return;
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({money:S.money,wave:S.wave,waveT:S.waveT,spawnQ:S.spawnQ,lives:S.lives,buys:S.buys,hand:S.hand,tiles:S.tiles.map(t=>t.lv),open:S.tiles.map(t=>t.open?1:0)}));
  }catch(e){}
}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
setInterval(save,2000);
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
function cost(){return Math.floor(22*Math.pow(1.085,S.wave-1)*Math.pow(1.03,S.buys));}
function tileCost(){
  const u=S.tiles.filter(t=>t.open).length;
  return Math.floor(28*Math.pow(1.6,Math.max(0,u-3)));
}
function tryUnlock(i){
  const t=S.tiles[i];
  const c=tileCost();
  if(S.money<c){say('お金が足りない',Math.min(400,Math.max(80,t.x)),t.y-20,'#ff8a8a');return;}
  S.money-=c;
  t.open=true;
  say('マス解放!',Math.min(400,Math.max(80,t.x)),t.y-20,'#9dff9d');
  save();
}
function power(){
  let p=0;
  for(const t of S.tiles)if(t.lv>0)p+=4*Math.pow(2.1,t.lv-1)/0.7;
  for(const h of S.hand)if(h>0)p+=0.7*4*Math.pow(2.1,h-1)/0.7;
  return p;
}
function baseLv(){return 1+Math.floor((S.wave-1)/8);}
function tier(){return Math.min(3,Math.floor((S.wave-1)/10));}
function maxLv(){
  let m=0;
  for(const t of S.tiles)m=Math.max(m,t.lv);
  for(const h of S.hand)m=Math.max(m,h);
  return m;
}
function roll(){
  const b=baseLv(),m=maxLv(),r=Math.random();
  const pg=Math.min(0.3,m*0.02);
  if(r<0.02&&m>1)return m;
  if(r<0.02+pg&&m>3)return Math.max(b,m-3+Math.floor(Math.random()*3));
  if(Math.random()<0.2)return b+1;
  return b;
}
function fmt(n){
  if(n>=1e6)return (n/1e6).toFixed(1)+'M';
  if(n>=1e3)return (n/1e3).toFixed(n>=1e5?0:1)+'K';
  return String(Math.floor(n));
}
function mmss(s){
  const m=Math.floor(s/60),r=s%60;
  return m+':'+(r<10?'0':'')+r;
}
function say(s,x,y,c){S.texts.push({s,x,y,c:c||'#fff',t:0});}
function get(l){return l.t==='h'?S.hand[l.i]:S.tiles[l.i].lv;}
function set(l,v){
  if(l.t==='h'){S.hand[l.i]=v;S.handT[l.i]=performance.now();}
  else S.tiles[l.i].lv=v;
}
function giveTowers(list){
  let extra=0;
  for(const lv of list){
    const k=S.hand.indexOf(0);
    if(k<0)extra+=Math.floor(10*Math.pow(2,lv-1));
    else{S.hand[k]=lv;S.handT[k]=performance.now();}
  }
  return extra;
}
function claimGift(){
  const now=Date.now();
  if(now<giftAt){
    say('あと '+mmss(Math.ceil((giftAt-now)/1000)),240,290,'#fff');
    return;
  }
  const m=cost()*12;
  S.money+=m+giveTowers([roll(),roll()]);
  setGift(now+GIFT_SEC*1000);
  say('時間報酬! +'+fmt(m),240,290,'#ffe14a');
  say('戦車 x2',240,330,'#9dff9d');
  save();
}
function redeem(raw){
  const code=String(raw||'').trim().toUpperCase();
  if(!code)return {ok:false,msg:'コードを入力してください'};
  const def=CODES[code];
  if(!def)return {ok:false,msg:'コードが違います'};
  if(usedCodes().indexOf(code)>=0)return {ok:false,msg:'使用済みのコードです'};
  const towers=def.towers||[];
  const free=S.hand.filter(v=>v===0).length;
  if(free<towers.length)return {ok:false,msg:'手持ちに空きが必要です'};
  S.money+=def.money||0;
  giveTowers(towers);
  markUsed(code);
  save();
  return {ok:true,msg:'コード報酬を受け取った!'};
}
const cb=document.getElementById('cb'),ci=document.getElementById('ci'),cm=document.getElementById('cm');
function openCode(){
  paused=true;
  cm.textContent='';
  ci.value='';
  cb.hidden=false;
  setTimeout(()=>ci.focus(),50);
}
function closeCode(){
  cb.hidden=true;
  paused=false;
  last=performance.now();
}
function submitCode(){
  const r=redeem(ci.value);
  if(r.ok){closeCode();say(r.msg,240,290,'#ffe14a');}
  else cm.textContent=r.msg;
}
document.getElementById('cok').addEventListener('click',submitCode);
document.getElementById('cx').addEventListener('click',closeCode);
ci.addEventListener('keydown',e=>{if(e.key==='Enter')submitCode();});
function hitLoc(x,y){
  for(let i=0;i<HAND_N;i++){
    const r=slotRect(i);
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return {t:'h',i};
  }
  for(let i=0;i<S.tiles.length;i++){
    const t=S.tiles[i];
    if(Math.abs(x-t.x)<30&&Math.abs(y-t.y)<30)return {t:'t',i};
  }
  return null;
}
function inRect(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}
function pt(e){
  const r=cv.getBoundingClientRect();
  return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];
}
function buy(){
  const c=cost();
  const free=[];
  for(let i=0;i<HAND_N;i++)if(S.hand[i]===0)free.push(i);
  if(S.money<c||free.length===0){S.flash=0.3;return;}
  S.money-=c;S.buys++;
  const r=Math.random();
  const n=Math.min(free.length,r<0.07?3:(r<0.25?2:1));
  const b=baseLv();
  let lucky=false;
  for(let k=0;k<n;k++){
    const lv=roll();
    if(lv>b+1)lucky=true;
    S.hand[free[k]]=lv;S.handT[free[k]]=performance.now();
  }
  if(n>1)say('x'+n+'!',230,640,'#ffe14a');
  if(lucky)say('ラッキー!',330,640,'#ff9ae6');
}
cv.addEventListener('pointerdown',e=>{
  const [x,y]=pt(e);
  S.px=x;S.py=y;
  if(S.over){clearSave();reset(false);return;}
  if(inRect(x,y,GIFT)){claimGift();return;}
  if(inRect(x,y,CODEBTN)){openCode();return;}
  if(inRect(x,y,BUY)){buy();return;}
  const l=hitLoc(x,y);
  if(l&&l.t==='t'&&!S.tiles[l.i].open){tryUnlock(l.i);return;}
  if(l&&get(l)>0){
    S.drag={from:l,lv:get(l)};
    set(l,0);
    S.handT[l.i]=0;
    cv.setPointerCapture(e.pointerId);
  }
});
cv.addEventListener('pointermove',e=>{const [x,y]=pt(e);S.px=x;S.py=y;});
function endDrag(e){
  if(!S.drag)return;
  const [x,y]=pt(e);
  const d=S.drag;
  S.drag=null;
  if(inRect(x,y,TRASH)){
    S.money+=Math.floor(10*Math.pow(2,d.lv-1));
    return;
  }
  const l=hitLoc(x,y);
  if(!l){set(d.from,d.lv);return;}
  if(l.t==='t'&&!S.tiles[l.i].open){set(d.from,d.lv);return;}
  const cur=get(l);
  if(l.t===d.from.t&&l.i===d.from.i){set(d.from,d.lv);return;}
  if(cur===0)set(l,d.lv);
  else if(cur===d.lv){set(l,d.lv+1);say('合成 Lv'+(d.lv+1),Math.min(430,Math.max(50,x)),y-30,'#9dff9d');}
  else{set(l,d.lv);set(d.from,cur);}
  save();
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
function spawn(boss){
  const w=S.wave,big=w%5===0;
  const exp=w<=8?1.155:(w<=14?1.12:1.09);
  const baseHp=11*Math.pow(exp,w-1);
  const adaptMul=0.48+Math.min(0.38,(w-1)*0.032);
  const hp0=Math.max(baseHp,power()*ADAPT*adaptMul);
  const rw=Math.ceil(6*Math.pow(1.16,w-1));
  const sp=Math.min(78,37+w*0.32);
  if(boss){
    const hb=hp0*(6.2+w*0.4)*(big?2.4:1);
    S.enemies.push({d:0,hp:hb,max:hb,sp:sp*0.7,r:rw*(big?35:12),boss:true,big,x:P[0][0],y:P[0][1]});
    say(big?'大ボス出現!':'ボス出現!',W/2,250,'#ff6a5a');
  }else{
    S.enemies.push({d:0,hp:hp0,max:hp0,sp,r:rw,x:P[0][0],y:P[0][1]});
  }
}
function doUlt(){
  S.ultCd=28;
  S.ultFlash=0.55;
  let got=0;
  const dmgBase=Math.max(power()*3.2,40+S.wave*8);
  for(const e of S.enemies){
    if(e.hp<=0)continue;
    if(e.d>TOTAL*0.42){
      const dmg=e.boss?dmgBase*1.1:dmgBase;
      e.hp-=dmg;
      if(e.hp<=0&&!e.leak){
        S.money+=e.r;
        got+=e.r;
      }
    }
  }
  say('緊急必殺!',W/2,300,'#ff6aff');
  if(got>0)say('+'+fmt(got),W/2,340,'#ffe14a');
}
function update(dt){
  S.time+=dt;
  if(S.flash>0)S.flash-=dt;
  if(S.hit>0)S.hit-=dt;
  if(S.ultFlash>0)S.ultFlash-=dt;
  S.ultCd=Math.max(0,S.ultCd-dt);
  S.waveT-=dt;
  if(S.waveT<=0){
    S.wave++;S.waveT=WAVE_SEC;
    const n=count(S.wave);
    S.spawnQ+=n;S.gap=14/n;
    S.bossT=6;S.bossOn=true;
    S.money+=Math.floor(cost()*0.3);
    say('WAVE '+S.wave,W/2,280,'#ffd95a');
  }
  if(S.bossOn){
    S.bossT-=dt;
    if(S.bossT<=0){S.bossOn=false;spawn(true);}
  }
  S.spawnT-=dt;
  if(S.spawnQ>0&&S.spawnT<=0){spawn(false);S.spawnQ--;S.spawnT=S.gap;}
  for(const e of S.enemies){
    e.d+=e.sp*dt;
    const p=pos(e.d);e.x=p[0];e.y=p[1];
    if(e.d>=TOTAL){e.hp=-1;e.leak=true;S.lives-=e.boss?3:1;S.hit=0.4;}
  }
  const danger=S.enemies.some(e=>e.hp>0&&e.d>TOTAL*0.68);
  if(danger&&S.ultCd<=0&&!S.over)doUlt();
  for(const t of S.tiles){
    if(t.lv<1)continue;
    t.cd-=dt;
    let best=null;
    for(const e of S.enemies){
      if(e.hp<=0||e.y<HUD_H)continue;
      if(Math.hypot(e.x-t.x,e.y-t.y)<=150&&(!best||e.d>best.d))best=e;
    }
    if(best){
      t.ang=Math.atan2(best.y-t.y,best.x-t.x);
      if(t.cd<=0){
        t.cd=0.7;
        S.bullets.push({x:t.x,y:t.y,tg:best,dmg:4*Math.pow(2.1,t.lv-1),c:t.lv});
      }
    }
  }
  for(const b of S.bullets){
    const e=b.tg;
    if(e.hp<=0){b.dead=true;continue;}
    const dx=e.x-b.x,dy=e.y-b.y,dist=Math.hypot(dx,dy);
    const step=520*dt;
    if(dist<=step+6){
      e.hp-=b.dmg;
      b.dead=true;
      if(e.hp<=0&&!e.leak){
        S.money+=e.r;
        if(e.boss||e.r>=20)say('+'+fmt(e.r),e.x,e.y-10,'#ffe14a');
      }
    }else{b.x+=dx/dist*step;b.y+=dy/dist*step;}
  }
  S.bullets=S.bullets.filter(b=>!b.dead);
  S.enemies=S.enemies.filter(e=>e.hp>0);
  for(const t of S.texts)t.t+=dt;
  S.texts=S.texts.filter(t=>t.t<1.2);
  if(S.lives<=0){
    S.lives=0;
    S.over=true;
    if(S.wave>S.best){
      S.best=S.wave;
      try{localStorage.setItem(BEST_KEY,String(S.best));}catch(e){}
    }
    clearSave();
  }
}
function rr(x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
function txt(s,x,y,size,color,align){
  g.font='bold '+size+'px sans-serif';
  g.textAlign=align||'center';g.textBaseline='middle';
  g.lineWidth=size/5;g.strokeStyle='rgba(0,0,0,0.65)';g.lineJoin='round';
  g.strokeText(s,x,y);g.fillStyle=color||'#fff';g.fillText(s,x,y);
}
function tower(x,y,s,lv,ang){
  const hue=(lv*47+15)%360;
  g.save();
  g.translate(x,y);
  g.rotate(ang+Math.PI/2);
  g.fillStyle='hsl('+hue+',55%,28%)';
  rr(-s*0.18,-s*0.62,s*0.16,s*0.4,3);g.fill();
  rr(s*0.02,-s*0.62,s*0.16,s*0.4,3);g.fill();
  g.fillStyle='hsl('+hue+',80%,52%)';
  rr(-s*0.42,-s*0.38,s*0.84,s*0.8,s*0.22);g.fill();
  g.lineWidth=2;g.strokeStyle='hsl('+hue+',70%,32%)';g.stroke();
  g.restore();
  g.fillStyle='#fff';
  g.beginPath();g.arc(x,y+s*0.02,s*0.22,0,7);g.fill();
  g.fillStyle='#222';
  g.font='bold '+Math.floor(s*(lv>9?0.26:0.32))+'px sans-serif';
  g.textAlign='center';g.textBaseline='middle';
  g.fillText(lv,x,y+s*0.04);
}
function house(){
  const hx=415,hy=598;
  if(S.hit>0){
    g.fillStyle='rgba(255,40,40,'+(S.hit*1.4)+')';
    g.beginPath();g.arc(hx,hy-10,70,0,7);g.fill();
  }
  if(S.ultFlash>0){
    g.fillStyle='rgba(255,80,255,'+(S.ultFlash*1.6)+')';
    g.beginPath();g.arc(hx,hy-10,90+S.ultFlash*40,0,7);g.fill();
  }
  g.save();
  g.translate(hx,hy);
  g.scale(1.4,1.4);
  g.fillStyle='rgba(0,0,0,0.25)';
  g.beginPath();g.ellipse(0,22,36,8,0,0,7);g.fill();
  g.fillStyle='#f4ead2';g.fillRect(-28,-18,56,40);
  g.fillStyle='#c4572a';
  g.beginPath();g.moveTo(-36,-16);g.lineTo(0,-52);g.lineTo(36,-16);g.fill();
  g.fillStyle='#7a4a22';g.fillRect(-8,2,16,20);
  g.fillStyle='#8fd0ff';g.fillRect(12,-8,10,10);
  g.restore();
  g.fillStyle='rgba(30,30,30,0.9)';
  rr(hx-48,hy-100,96,28,8);g.fill();
  txt('HOME ♥'+S.lives,hx,hy-86,16,'#ff8a8a');
}
function drawBg(){
  g.fillStyle='#8fcf2a';g.fillRect(0,0,W,H);
  g.fillStyle='rgba(120,190,30,0.5)';
  for(let i=0;i<8;i++){g.beginPath();g.arc(60+i*60,300+((i*97)%400),70,0,7);g.fill();}
  g.lineCap='round';g.lineJoin='round';
  g.strokeStyle='#8a5a22';g.lineWidth=52;
  g.beginPath();P.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();
  g.strokeStyle='#c8914a';g.lineWidth=44;
  g.beginPath();P.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();
  const trees=[[28,235],[165,205],[300,205],[455,235],[460,450],[455,530],[30,595],[190,600],[275,545],[100,610]];
  for(const t of trees){
    g.fillStyle='#2f7a2c';
    g.beginPath();g.moveTo(t[0],t[1]-26);g.lineTo(t[0]+15,t[1]+12);g.lineTo(t[0]-15,t[1]+12);g.fill();
    g.fillStyle='#6b4423';g.fillRect(t[0]-3,t[1]+12,6,8);
  }
}
function drawEnemy(e){
  const s=e.boss?1.9:1;
  g.save();
  g.translate(e.x,e.y);
  g.scale(s,s);
  g.fillStyle='rgba(0,0,0,0.25)';
  g.beginPath();g.ellipse(0,14,12,5,0,0,7);g.fill();
  g.fillStyle=e.boss?(e.big?'#7a1fa8':'#c0392b'):'#7d8fd6';
  g.beginPath();g.arc(0,0,13,0,7);g.fill();
  g.fillStyle=e.boss?'#d6e08a':'#9fd18a';
  g.beginPath();g.arc(0,-6,8,0,7);g.fill();
  g.fillStyle='#222';
  g.fillRect(-5,-8,3,3);g.fillRect(2,-8,3,3);
  if(e.boss){
    g.fillStyle='#ffd23a';
    g.beginPath();g.moveTo(-8,-13);g.lineTo(-8,-20);g.lineTo(-4,-16);g.lineTo(0,-22);g.lineTo(4,-16);g.lineTo(8,-20);g.lineTo(8,-13);g.fill();
  }
  g.restore();
  const bw=e.boss?60:28,by=e.y-26*s;
  g.fillStyle='#333';g.fillRect(e.x-bw/2,by,bw,e.boss?7:5);
  g.fillStyle=e.boss?'#ff5a4a':'#5ee05e';
  g.fillRect(e.x-bw/2,by,bw*Math.max(0,e.hp/e.max),e.boss?7:5);
}
function hud(){
  g.fillStyle='#16240e';g.fillRect(0,0,W,HUD_H);
  g.fillStyle='#2c4a1a';g.fillRect(0,HUD_H-4,W,4);
  const ready=Date.now()>=giftAt;
  const pulse=0.7+0.3*Math.sin(S.time*6);
  g.fillStyle=ready?'rgba(255,190,40,'+pulse+')':'rgba(255,255,255,0.14)';
  rr(GIFT.x,GIFT.y,GIFT.w,GIFT.h,10);g.fill();
  txt(ready?'🎁 時間報酬 受け取る!':'🎁 次の報酬まで '+mmss(Math.ceil((giftAt-Date.now())/1000)),GIFT.x+GIFT.w/2,GIFT.y+GIFT.h/2,16,ready?'#fff':'#ddd');
  g.fillStyle='rgba(120,170,255,0.35)';
  rr(CODEBTN.x,CODEBTN.y,CODEBTN.w,CODEBTN.h,10);g.fill();
  txt('🔑 コード入力',CODEBTN.x+CODEBTN.w/2,CODEBTN.y+CODEBTN.h/2,16,'#fff');
  g.save();
  g.translate(0,36);
  g.fillStyle='rgba(30,30,30,0.85)';
  rr(60,14,330,44,8);g.fill();
  g.fillStyle='#f5b81c';g.beginPath();g.arc(60,36,26,0,7);g.fill();
  g.fillStyle='#ffd95a';g.beginPath();g.arc(60,36,19,0,7);g.fill();
  txt('$',60,37,26,'#c97a00');
  txt(fmt(S.money),225,37,28,'#fff');
  const ws=[S.wave-1,S.wave,S.wave+1];
  ws.forEach((w,i)=>{
    const big=i===1;
    const bw=big?96:62,bh=big?68:44;
    const cx=[150,240,330][i],cy=big?102:106;
    g.fillStyle=big?'rgba(0,0,0,0.6)':'rgba(255,255,255,0.1)';
    rr(cx-bw/2,cy-bh/2,bw,bh,8);g.fill();
    if(big){
      txt('WAVE',cx,cy-20,14,'#ffd95a');
      txt(String(w),cx,cy+8,36,'#fff');
    }else if(w>=1)txt(String(w),cx,cy,22,'#bbb');
  });
  g.fillStyle='rgba(0,0,0,0.5)';g.fillRect(190,142,100,7);
  g.fillStyle='#ffd95a';g.fillRect(190,142,100*(1-Math.max(0,S.waveT)/WAVE_SEC),7);
  txt('次の波まで '+Math.ceil(Math.max(0,S.waveT))+'秒',240,159,14,'#fff');
  txt('ベスト '+S.best,12,90,14,'#ffe9a0','left');
  txt('♥ '+S.lives,12,116,22,'#ff8a8a','left');
  txt(S.bossOn?'ボスまで '+Math.ceil(S.bossT)+'秒':'ボス出現済み',468,106,14,'#ff9a8a','right');
  if(S.ultCd>0)txt('必殺CD '+Math.ceil(S.ultCd)+'s',468,128,13,'#d080ff','right');
  else txt('必殺 READY',468,128,13,'#ff9aff','right');
  g.restore();
}
function draw(){
  drawBg();
  house();
  const tc=tileCost();
  for(const t of S.tiles){
    if(t.open){
      g.fillStyle=t.lv?'rgba(60,80,200,0.35)':'rgba(40,90,20,0.45)';
      rr(t.x-30,t.y-30,60,60,8);g.fill();
    }else{
      g.fillStyle='rgba(15,25,10,0.7)';
      rr(t.x-30,t.y-30,60,60,8);g.fill();
      txt('🔒',t.x,t.y-8,20,'#fff');
      txt(fmt(tc),t.x,t.y+17,15,S.money>=tc?'#ffe14a':'#bbb');
    }
  }
  for(const t of S.tiles)if(t.lv>0)tower(t.x,t.y,56,t.lv,t.ang);
  for(const e of S.enemies)drawEnemy(e);
  for(const b of S.bullets){
    g.fillStyle='hsl('+((b.c*47+15)%360)+',90%,60%)';
    g.beginPath();g.arc(b.x,b.y,5,0,7);g.fill();
  }
  hud();
  g.fillStyle='rgba(255,255,255,0.35)';
  rr(TRASH.x,TRASH.y,TRASH.w,TRASH.h,8);g.fill();
  g.fillStyle='#777';
  g.fillRect(TRASH.x+12,TRASH.y+16,28,34);
  g.fillRect(TRASH.x+8,TRASH.y+11,36,4);
  g.fillStyle='#999';
  for(let i=0;i<3;i++)g.fillRect(TRASH.x+17+i*9,TRASH.y+21,3,24);
  const ok=S.money>=cost()&&S.hand.indexOf(0)>=0;
  g.fillStyle=S.flash>0?'#e24a3a':(ok?'#f6c026':'#b9a04a');
  rr(BUY.x,BUY.y,BUY.w,BUY.h,14);g.fill();
  g.lineWidth=4;g.strokeStyle='#8a6410';g.stroke();
  const cc=['#b98a4a','#b8c2cc','#f3c93a','#b06be0'][tier()];
  g.fillStyle=cc;rr(BUY.x+30,BUY.y+34,70,60,6);g.fill();
  g.strokeStyle='rgba(0,0,0,0.4)';g.lineWidth=3;
  g.beginPath();g.moveTo(BUY.x+34,BUY.y+38);g.lineTo(BUY.x+96,BUY.y+90);
  g.moveTo(BUY.x+96,BUY.y+38);g.lineTo(BUY.x+34,BUY.y+90);g.stroke();
  txt('Lv'+baseLv()+'〜',BUY.x+65,BUY.y+116,20,'#fff');
  g.fillStyle='#f5b81c';g.beginPath();g.arc(BUY.x+26,BUY.y+160,13,0,7);g.fill();
  txt(fmt(cost()),BUY.x+44,BUY.y+160,24,'#fff','left');
  g.fillStyle='rgba(70,80,75,0.92)';
  rr(150,650,320,200,12);g.fill();
  const now=performance.now();
  for(let i=0;i<HAND_N;i++){
    const r=slotRect(i);
    g.fillStyle='rgba(255,255,255,0.12)';
    rr(r.x,r.y,r.w,r.h,8);g.fill();
    if(S.hand[i]>0){
      const a=Math.min(1,(now-S.handT[i])/300);
      const off=-(1-a)*90;
      g.globalAlpha=0.3+0.7*a;
      tower(r.x+r.w/2,r.y+r.h/2+off,56,S.hand[i],-Math.PI/2);
      g.globalAlpha=1;
    }
  }
  if(S.drag){
    g.globalAlpha=0.9;
    tower(S.px,S.py-10,64,S.drag.lv,-Math.PI/2);
    g.globalAlpha=1;
  }
  for(const t of S.texts){
    g.globalAlpha=Math.max(0,1-t.t/1.2);
    txt(t.s,t.x,t.y-t.t*40,26,t.c);
    g.globalAlpha=1;
  }
  if(S.over){
    g.fillStyle='rgba(0,0,0,0.65)';g.fillRect(0,0,W,H);
    txt('ゲームオーバー',W/2,360,40,'#fff');
    txt('到達ウェーブ '+S.wave,W/2,420,28,'#ffd95a');
    txt('ベスト WAVE '+S.best,W/2,460,20,'#ffe9a0');
    txt('タップでリスタート',W/2,510,22,'#fff');
  }
}
let last=performance.now();
function loop(n){
  const dt=Math.min(0.05,(n-last)/1000);
  last=n;
  if(!S.over&&!paused)update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
